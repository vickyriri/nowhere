name: Remote MCP and persistence
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[remote,dev]' -c requirements-remote.txt 'moto[s3,server]>=5,<6'
      - run: pytest -q tests
      - run: node --test tests/test_observer_polling.cjs
